
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDII</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 25px;
  font-size: 28px;
  font-weight: bold;
  color: #f5c542;
}
.balance {
  text-align: center;
  margin-top: 55px;
}
.balance h1 { font-size: 38px; }
.coin {
  display: block;
  margin: 30px auto;
  width: 155px;
  height: 155px;
  border-radius: 50%;
  border: 5px solid #f5c542;
  background: linear-gradient(145deg,#ffdf70,#d99b16);
  color: #402800;
  font-size: 65px;
  cursor: pointer;
  box-shadow: 0 0 35px #d99b1680;
}
.coin:active { transform: scale(.94); }
.page {
  display: none;
  text-align: center;
  padding: 25px;
}
.page.active { display: block; }
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #151d32;
  border-top: 1px solid #34415b;
  padding: 10px 2px calc(10px + env(safe-area-inset-bottom));
}
nav button {
  flex: 1;
  border: 0;
  background: none;
  color: #aab4c8;
  font-size: 11px;
  padding: 5px 0;
  cursor: pointer;
}
nav button span {
  display: block;
  font-size: 21px;
  margin-bottom: 4px;
}
nav button.selected { color: #f5c542; }
</style>
</head>
<body>

<header>SIDII</header>

<div id="game" class="page active">
  <div class="balance">
    <p>ТВІЙ БАЛАНС</p>
    <h1><span id="coins">0</span> 🪙</h1>
    <button class="coin" onclick="tap()">🪙</button>
    <p>Натискай на монету!</p>
  </div>
</div>

<div id="upgrade" class="page">
  <h2>⚡ Upgrade</h2>
  <p>Покращення скоро з'являться!</p>
</div>

<div id="friends" class="page">
  <h2>👥 Друзі</h2>
  <p>Запрошуй друзів у SIDII!</p>
</div>

<div id="profile" class="page">
  <h2>👤 Профіль</h2>
  <p>Гравець SIDII</p>
</div>

<nav>
  <button class="selected" onclick="showPage('game',this)">
    <span>🎮</span>Гра
  </button>
  <button onclick="showPage('upgrade',this)">
    <span>⚡</span>Upgrade
  </button>
  <button onclick="showPage('friends',this)">
    <span>👥</span>Друзі
  </button>
  <button onclick="showPage('profile',this)">
    <span>👤</span>Профіль
  </button>
</nav>

<script>
let coins = 0;

function tap() {
  coins++;
  document.getElementById('coins').textContent = coins;
}

function showPage(id, button) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('selected'));
  button.classList.add('selected');
}
</script>

</body>
</html>
